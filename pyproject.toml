[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dep-triage"
version = "0.1.0"
description = "Triage Dependabot PRs after CI runs, per project policy. Dry-run by default."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dep-triage = "dep_triage.cli:main"
